<!DOCTYPE html>
<html>
<head>
    <title>Student API Interface</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333333;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            color: #34495e;
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-warning { background-color: #f39c12; color: white; }
        .btn-warning:hover { background-color: #d68910; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-secondary { background-color: #95a5a6; }
        .btn-secondary:hover { background-color: #7f8c8d; }

        input {
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .inline-group input {
            width: 60%;
            margin-right: 8px;
            margin-bottom: 0;
            display: inline-block;
        }

        .result-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #f9f9f9;
            border-left: 4px solid #3498db;
            border-radius: 4px;
        }

        .student-item {
            padding: 10px;
            margin-bottom: 8px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Student API Interface</h1>

    <!-- Student Information Section -->
    <div class="card">
        <h2>Student Information</h2>
        <button onclick="loadStudent()">Load Student Information</button>
        <div id="result"></div>
    </div>

    <!-- Greeting API Section -->
    <div class="card">
        <h2>Greeting API</h2>
        <div class="inline-group">
            <input type="text" id="nameInput" placeholder="Enter your first name">
            <button onclick="sayHello()">Say Hello</button>
        </div>
        <p id="greeting" style="font-weight: bold; margin-top: 12px; color: #2c3e50;"></p>
    </div>

    <!-- Course Information Section -->
    <div class="card">
        <h2>Course Information</h2>
        <button onclick="loadCourses()">Load Course Information</button>
        <div id="coursesResult"></div>
    </div>

    <!-- CRUD Form Section (Step 4: Add / Edit) -->
    <div class="card">
        <h2 id="formTitle">Add New Student</h2>
        <form id="studentForm" onsubmit="saveStudent(event)">
            <input type="hidden" id="studentDbId">
            <label style="font-size: 0.85rem; color: #666;">Student ID</label>
            <input type="text" id="crudStudentId" placeholder="e.g. 24-00094" required>
            
            <label style="font-size: 0.85rem; color: #666;">Name</label>
            <input type="text" id="crudName" placeholder="Full Name" required>
            
            <label style="font-size: 0.85rem; color: #666;">Program</label>
            <input type="text" id="crudProgram" placeholder="Program (e.g. BSIT)" required>
            
            <label style="font-size: 0.85rem; color: #666;">Year</label>
            <input type="number" id="crudYear" placeholder="Year" required>
            
            <label style="font-size: 0.85rem; color: #666;">Section</label>
            <input type="text" id="crudSection" placeholder="Section (e.g. B)" required>
            
            <div style="margin-top: 5px;">
                <button type="submit" class="btn-success" id="saveBtn">Add Student</button>
                <button type="button" class="btn-secondary" onclick="resetForm()">Cancel</button>
            </div>
        </form>
    </div>

    <!-- Database Students Section (My Records) -->
    <div class="card">
        <h2>My Records (Database)</h2>
        <button onclick="loadStudents()">Load My Students</button>
        <div id="studentList"></div>
    </div>

    <!-- Additional Task: Filter Students by Section -->
    <div class="card">
        <h2>Filter Students by Section</h2>
        <div class="inline-group">
            <input type="text" id="sectionInput" placeholder="Enter section (e.g., A or B)">
            <button onclick="loadStudentsBySection()">Filter</button>
        </div>
        <div id="sectionResult"></div>
    </div>

    <!-- Classmate's Records Section (Step 8) -->
    <div class="card">
        <h2>Classmate's Records</h2>
        <div class="inline-group">
            <input type="text" id="classmateApiInput" placeholder="Enter Classmate Render URL">
            <button onclick="loadClassmateStudents()" class="btn-warning">Load Classmate</button>
        </div>
        <div id="classmateResult"></div>
    </div>

    <script>
        function loadStudent() {
            fetch('/student')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<div class="result-box">' +
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>' +
                        '</div>';
                })
                .catch(error => {
                    document.getElementById('result').innerHTML =
                        '<p style="color: red;">Unable to retrieve data.</p>';
                });
        }

        function sayHello() {
            const name = document.getElementById('nameInput').value;
            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => response.json())
                .then(data => {
                    document.getElementById('greeting').innerText = data.message;
                })
                .catch(error => {
                    document.getElementById('greeting').innerText = 'Unable to retrieve greeting.';
                });
        }

        function loadCourses() {
            fetch('/courses')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('coursesResult').innerHTML =
                        '<div class="result-box">' +
                        '<p><b>Course Code:</b> ' + data.code + '</p>' +
                        '<p><b>Course Name:</b> ' + data.name + '</p>' +
                        '<p><b>Units:</b> ' + data.units + '</p>' +
                        '</div>';
                })
                .catch(error => {
                    document.getElementById('coursesResult').innerHTML =
                        '<p style="color: red;">Unable to retrieve course data.</p>';
                });
        }

        // READ My Students (with Edit and Delete buttons)
        function loadStudents() {
            fetch('/api/students')
                .then(response => response.json())
                .then(data => {
                    let output = '<div class="result-box">';
                    if (data.length === 0) {
                        output += '<p>No student records found.</p>';
                    } else {
                        data.forEach(student => {
                            output += `
                                <div class="student-item">
                                    <div>
                                        <b>${student.student_id}</b> - ${student.name} | ${student.program} | Yr ${student.year} | Sec ${student.section}
                                    </div>
                                    <div>
                                        <button class="btn-warning" onclick="editStudent(${student.id}, '${student.student_id}', '${student.name}', '${student.program}', ${student.year}, '${student.section}')">Edit</button>
                                        <button class="btn-danger" onclick="deleteStudent(${student.id})">Delete</button>
                                    </div>
                                </div>
                            `;
                        });
                    }
                    output += '</div>';
                    document.getElementById('studentList').innerHTML = output;
                })
                .catch(error => {
                    document.getElementById('studentList').innerHTML =
                        '<p style="color: red;">Unable to retrieve student records.</p>';
                });
        }

        // CREATE or UPDATE Student (POST or PUT)
        function saveStudent(event) {
            event.preventDefault();
            const dbId = document.getElementById('studentDbId').value;
            const studentData = {
                student_id: document.getElementById('crudStudentId').value,
                name: document.getElementById('crudName').value,
                program: document.getElementById('crudProgram').value,
                year: parseInt(document.getElementById('crudYear').value),
                section: document.getElementById('crudSection').value
            };

            const method = dbId ? 'PUT' : 'POST';
            const url = dbId ? '/api/students/' + dbId : '/api/students';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentData)
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message || 'Success!');
                resetForm();
                loadStudents();
            })
            .catch(error => {
                alert('Error saving student record.');
                console.error(error);
            });
        }

        // Populate Form for Editing
        function editStudent(id, student_id, name, program, year, section) {
            document.getElementById('studentDbId').value = id;
            document.getElementById('crudStudentId').value = student_id;
            document.getElementById('crudName').value = name;
            document.getElementById('crudProgram').value = program;
            document.getElementById('crudYear').value = year;
            document.getElementById('crudSection').value = section;
            
            document.getElementById('formTitle').innerText = 'Edit Student (ID: ' + id + ')';
            document.getElementById('saveBtn').innerText = 'Update Student';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // DELETE Student
        function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student record?')) {
                fetch('/api/students/' + id, { method: 'DELETE' })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message || 'Student deleted');
                        loadStudents();
                    })
                    .catch(error => {
                        alert('Error deleting student record.');
                        console.error(error);
                    });
            }
        }

        // Reset Form
        function resetForm() {
            document.getElementById('studentForm').reset();
            document.getElementById('studentDbId').value = '';
            document.getElementById('formTitle').innerText = 'Add New Student';
            document.getElementById('saveBtn').innerText = 'Add Student';
        }

        function loadStudentsBySection() {
            const section = document.getElementById('sectionInput').value.trim();
            if (!section) {
                alert('Please enter a section name.');
                return;
            }

            fetch('/students/section/' + encodeURIComponent(section))
                .then(response => response.json())
                .then(data => {
                    let output = '<div class="result-box">';
                    if (data.length === 0) {
                        output += '<p>No students found for Section ' + section + '</p>';
                    } else {
                        data.forEach(student => {
                            output += '<p><b>' + student.student_id + '</b> - ' + student.name + ' | ' + student.program + ' | Year ' + student.year + ' | Section ' + student.section + '</p>';
                        });
                    }
                    output += '</div>';
                    document.getElementById('sectionResult').innerHTML = output;
                })
                .catch(error => {
                    document.getElementById('sectionResult').innerHTML =
                        '<p style="color: red;">Unable to retrieve section records.</p>';
                });
        }

        // Load Classmate's Records (Using Python Proxy to Bypass CORS)
        function loadClassmateStudents() {
            const classmateUrl = document.getElementById('classmateApiInput').value.trim();
            if (!classmateUrl) {
                alert("Please enter your classmate's Render API URL.");
                return;
            }

            const targetApi = classmateUrl.endsWith('/api/students') ? classmateUrl : classmateUrl.replace(/\/$/, '') + '/api/students';

            // Dito dadaan sa proxy para hindi ma-block ng CORS
            fetch('/proxy-classmate?url=' + encodeURIComponent(targetApi))
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    let output = '<div class="result-box" style="border-left-color: #f39c12;">';
                    if (!Array.isArray(data) || data.length === 0) {
                        output += '<p>No records found from classmate API.</p>';
                    } else {
                        data.forEach(student => {
                            output += '<p><b>' + (student.student_id || '') + '</b> - ' + (student.name || '') + ' | ' + (student.program || '') + ' | Year ' + (student.year || '') + ' | Section ' + (student.section || '') + '</p>';
                        });
                    }
                    output += '</div>';
                    document.getElementById('classmateResult').innerHTML = output;
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('classmateResult').innerHTML =
                        '<p style="color: red;">Unable to retrieve classmate records. Check URL or CORS/Render status.</p>';
                });
        }
    </script>
</body>
</html>
