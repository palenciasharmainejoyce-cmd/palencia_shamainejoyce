<script>
        // Global variable para ligtas na ma-access ang partner records nang walang quote/syntax errors
        window.partnerStudentsCache = [];

        function loadStudent() {
            fetch('/student')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<div class="result-box">' +
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>' +
                        '</div>';
                })
                .catch(error => {
                    document.getElementById('result').innerHTML =
                        '<p style="color: red;">Unable to retrieve data.</p>';
                });
        }

        function sayHello() {
            const name = document.getElementById('nameInput').value;
            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => response.json())
                .then(data => {
                    document.getElementById('greeting').innerText = data.message;
                })
                .catch(error => {
                    document.getElementById('greeting').innerText = 'Unable to retrieve greeting.';
                });
        }

        function loadCourses() {
            fetch('/courses')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('coursesResult').innerHTML =
                        '<div class="result-box">' +
                        '<p><b>Course Code:</b> ' + data.code + '</p>' +
                        '<p><b>Course Name:</b> ' + data.name + '</p>' +
                        '<p><b>Units:</b> ' + data.units + '</p>' +
                        '</div>';
                })
                .catch(error => {
                    document.getElementById('coursesResult').innerHTML =
                        '<p style="color: red;">Unable to retrieve course data.</p>';
                });
        }

        // READ My Students (with Source Badges, View Details, Edit, and Delete buttons)
        function loadStudents() {
            document.getElementById('searchInput').value = '';
            fetch('/api/students')
                .then(response => response.json())
                .then(data => {
                    displayStudentList(data);
                })
                .catch(error => {
                    document.getElementById('studentList').innerHTML =
                        '<p style="color: red;">Unable to retrieve student records.</p>';
                });
        }

        // Search My Students Feature
        function searchStudents() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            fetch('/api/students')
                .then(response => response.json())
                .then(data => {
                    const filtered = data.filter(student => 
                        (student.name && student.name.toLowerCase().includes(query)) || 
                        (student.student_id && student.student_id.toLowerCase().includes(query))
                    );
                    displayStudentList(filtered);
                })
                .catch(error => {
                    console.error(error);
                });
        }

        // Helper to display student list with Source Badges and Action buttons
        function displayStudentList(data) {
            let output = '<div class="result-box">';
            if (data.length === 0) {
                output += '<p>No student records found.</p>';
            } else {
                data.forEach(student => {
                    let badgeClass = 'badge-local';
                    let src = student.source || 'Local';
                    if (src === 'Classmate API') badgeClass = 'badge-import';
                    else if (src === 'Partner API' || src === 'External API') badgeClass = 'badge-external';

                    output += `
                        <div class="student-item">
                            <div>
                                <b>${student.student_id}</b> - ${student.name}
                                <span class="badge ${badgeClass}">${src}</span>
                            </div>
                            <div>
                                <button class="btn-success" onclick='showOwnStudentDetails(${JSON.stringify(student)})'>View</button>
                                <button class="btn-warning" onclick="editStudent(${student.id}, '${student.student_id}', '${student.name}', '${student.program}', ${student.year}, '${student.section}')">Edit</button>
                                <button class="btn-danger" onclick="deleteStudent(${student.id})">Delete</button>
                            </div>
                        </div>
                    `;
                });
            }
            output += '</div>';
            document.getElementById('studentList').innerHTML = output;
        }

        // Show Complete Details for Own/Imported Record
        function showOwnStudentDetails(student) {
            const detailsHtml = `
                <div class="result-box" style="background-color: #e8f5e9; border-left: 4px solid #2ecc71;">
                    <h3>Student Complete Details</h3>
                    <p><b>Student ID:</b> ${student.student_id || 'N/A'}</p>
                    <p><b>Full Name:</b> ${student.name || 'N/A'}</p>
                    <p><b>Program:</b> ${student.program || 'N/A'}</p>
                    <p><b>Year Level:</b> ${student.year || 'N/A'}</p>
                    <p><b>Section:</b> ${student.section || 'N/A'}</p>
                    <p><b>Source:</b> ${student.source || 'Local'}</p>
                </div>
            `;
            document.getElementById('ownStudentDetails').innerHTML = detailsHtml;
        }

        // CREATE or UPDATE Student (POST or PUT)
        function saveStudent(event) {
            event.preventDefault();
            const dbId = document.getElementById('studentDbId').value;
            const studentData = {
                student_id: document.getElementById('crudStudentId').value,
                name: document.getElementById('crudName').value,
                program: document.getElementById('crudProgram').value,
                year: parseInt(document.getElementById('crudYear').value),
                section: document.getElementById('crudSection').value,
                source: 'Local'
            };

            const method = dbId ? 'PUT' : 'POST';
            const url = dbId ? '/api/students/' + dbId : '/api/students';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentData)
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message || 'Success!');
                resetForm();
                loadStudents();
            })
            .catch(error => {
                alert('Error saving student record.');
                console.error(error);
            });
        }

        // Populate Form for Editing
        function editStudent(id, student_id, name, program, year, section) {
            document.getElementById('studentDbId').value = id;
            document.getElementById('crudStudentId').value = student_id;
            document.getElementById('crudName').value = name;
            document.getElementById('crudProgram').value = program;
            document.getElementById('crudYear').value = year;
            document.getElementById('crudSection').value = section;
            
            document.getElementById('formTitle').innerText = 'Edit Student (ID: ' + id + ')';
            document.getElementById('saveBtn').innerText = 'Update Student';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // DELETE Student
        function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student record?')) {
                fetch('/api/students/' + id, { method: 'DELETE' })
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message || 'Student deleted');
                        loadStudents();
                    })
                    .catch(error => {
                        alert('Error deleting student record.');
                        console.error(error);
                    });
            }
        }

        // Reset Form
        function resetForm() {
            document.getElementById('studentForm').reset();
            document.getElementById('studentDbId').value = '';
            document.getElementById('formTitle').innerText = 'Add New Student';
            document.getElementById('saveBtn').innerText = 'Add Student';
        }

        function loadStudentsBySection() {
            const section = document.getElementById('sectionInput').value.trim();
            if (!section) {
                alert('Please enter a section name.');
                return;
            }

            fetch('/students/section/' + encodeURIComponent(section))
                .then(response => response.json())
                .then(data => {
                    let output = '<div class="result-box">';
                    if (data.length === 0) {
                        output += '<p>No students found for Section ' + section + '</p>';
                    } else {
                        data.forEach(student => {
                            output += '<p><b>' + student.student_id + '</b> - ' + student.name + ' | ' + student.program + ' | Year ' + student.year + ' | Section ' + student.section + '</p>';
                        });
                    }
                    output += '</div>';
                    document.getElementById('sectionResult').innerHTML = output;
                })
                .catch(error => {
                    document.getElementById('sectionResult').innerHTML =
                        '<p style="color: red;">Unable to retrieve section records.</p>';
                });
        }

        // Lab 9 Step 4: Load Partner Records via Flask /partner-records endpoint (Safe Index-based)
        function loadPartnerRecords() {
            fetch('/partner-records')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    window.partnerStudentsCache = data; // Save sa global cache
                    let output = '<div class="result-box" style="border-left-color: #f39c12;">';
                    if (!Array.isArray(data) || data.length === 0) {
                        output += '<p>No records found from partner API.</p>';
                    } else {
                        output += '<p><b>Partner Students (Select to View or Save):</b></p>';
                        data.forEach((student, index) => {
                            output += `
                                <div class="student-item" style="margin-bottom: 8px;">
                                    <span><b>${student.student_id || ''}</b> - ${student.name || ''}</span>
                                    <div>
                                        <button class="btn-secondary" onclick="showPartnerStudentDetails(${index})">View</button>
                                        <button class="btn-warning" onclick="savePartnerRecord(${index})">Save to My Database</button>
                                    </div>
                                </div>
                            `;
                        });
                    }
                    output += '</div>';
                    document.getElementById('partnerResult').innerHTML = output;
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('partnerResult').innerHTML =
                        '<p style="color: red;">Unable to retrieve partner records. Check backend route or partner URL.</p>';
                });
        }

        // Show Partner Student Details using cache index
        function showPartnerStudentDetails(index) {
            const student = window.partnerStudentsCache[index];
            if (!student) return;
            const detailsHtml = `
                <div class="result-box" style="background-color: #fff8e1; border-left: 4px solid #f39c12;">
                    <h3>Partner Record Details (Before Saving)</h3>
                    <p><b>Student ID:</b> ${student.student_id || 'N/A'}</p>
                    <p><b>Full Name:</b> ${student.name || 'N/A'}</p>
                    <p><b>Program:</b> ${student.program || 'N/A'}</p>
                    <p><b>Year Level:</b> ${student.year || 'N/A'}</p>
                    <p><b>Section:</b> ${student.section || 'N/A'}</p>
                </div>
            `;
            document.getElementById('partnerDetails').innerHTML = detailsHtml;
        }

        // Lab 9 Step 6: Save Partner Record to My Database using cache index
        function savePartnerRecord(index) {
            const student = window.partnerStudentsCache[index];
            if (!student) return;

            fetch('/import-student', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(student)
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message || 'Remote record saved successfully!');
                loadStudents(); // Refresh My Records para makita ang bagong imported record na may Classmate API badge
            })
            .catch(error => {
                alert('Error saving remote record.');
                console.error(error);
            });
        }
    </script>
